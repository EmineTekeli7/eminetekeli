    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="../index.html">Emine'nin Mağazası</a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="Menüyü aç">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links" id="navLinks">

        </nav>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Bizimle İletişime Geçin</h2>

            <form id="iletisimFormu">
                <div class="form-group">
                    <label for="adSoyad">Ad Soyad:</label>
                    <input type="text" id="adSoyad" placeholder="Adınızı ve soyadınızı yazınız">
                </div>
                <div class="form-group">
                    <label for="eposta">E-Posta Adresi:</label>
                    <input type="email" id="eposta" placeholder="E-posta adresinizi yazınız">
                </div>
                <div class="form-group">
                    <label for="mesaj">Mesajınız:</label>
                    <textarea id="mesaj" rows="5" placeholder="Sorularınızı veya önerilerinizi buraya yazınız..."></textarea>
                </div>
                <button type="submit" class="submit-btn">Mesajı Gönder</button>
            </form>

            <div id="formMesaj" class="form-mesaj"></div>
        </div>
    </main>
